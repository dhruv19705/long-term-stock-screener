# Fit scoring per risk profile id
profiles:
  conservative:
    max_stock_risk: 40
    max_beta: 1.0
    exclude_valuation: ["Over"]
    require_hard_gates: true
    beta_schedule:
      comfort: 1.0
      knots:
        - { beta: 1.0, penalty: 0 }
        - { beta: 1.3, penalty: 6 }
        - { beta: 1.6, penalty: 14 }
        - { beta: 2.2, penalty: 25 }
      exclude_above: 2.2
    penalties:
      stock_risk_over_max: 30
      valuation_over: 25
      bad_leverage: 35
      bad_market_risk: 25
      red_flag: 40
      high_beta: 15
      cyclical_sector: 20
    bonuses:
      valuation_under: 10
      low_drawdown: 5

  moderate:
    max_stock_risk: 55
    max_beta: 1.3
    exclude_valuation: []
    require_hard_gates: true
    beta_schedule:
      comfort: 1.3
      knots:
        - { beta: 1.3, penalty: 0 }
        - { beta: 1.6, penalty: 6 }
        - { beta: 2.2, penalty: 16 }
    penalties:
      stock_risk_over_max: 20
      valuation_over: 10
      bad_leverage: 25
      red_flag: 35
      high_beta: 10
    bonuses:
      valuation_under: 8
      composite_over_70: 10
      deep_sector_fit: 8

  growth:
    max_stock_risk: 65
    max_beta: 1.5
    exclude_valuation: []
    require_hard_gates: false
    beta_schedule:
      comfort: 1.5
      knots:
        - { beta: 1.5, penalty: 0 }
        - { beta: 1.8, penalty: 6 }
        - { beta: 2.2, penalty: 14 }
    penalties:
      stock_risk_over_max: 15
      red_flag: 30
      weak_growth: 15
    bonuses:
      strong_growth: 12
      valuation_under_with_growth: 10

  aggressive:
    max_stock_risk: 80
    max_beta: 2.0
    exclude_valuation: []
    require_hard_gates: false
    beta_schedule:
      comfort: 2.0
      knots:
        - { beta: 2.0, penalty: 0 }
        - { beta: 2.5, penalty: 4 }
        - { beta: 3.0, penalty: 10 }
    penalties:
      red_flag: 25
      stock_risk_over_max: 10
    bonuses:
      strong_momentum: 12
      strong_growth: 10
      composite_over_70: 8

fit_labels:
  - { min: 80, label: Excellent }
  - { min: 60, label: Good }
  - { min: 40, label: Fair }
  - { min: 0, label: Poor }

matcher:
  top_n_total: 20
  top_n_per_sector: 3
  top_n_per_sector_high_div: 2
  min_sectors_high_div: 8
  min_fit_score: 45
  sector_floor_quotas:
    banking: 2
    it: 2
