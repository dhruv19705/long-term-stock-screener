profiles:
  - id: conservative
    label: Capital Preservation
  - id: moderate
    label: Balanced Growth
  - id: growth
    label: Growth Oriented
  - id: aggressive
    label: High Conviction

questions:
  # Chapter: Goals
  - id: horizon
    text: What is your investment time horizon?
    options:
      - { id: short, label: Less than 1 year, scores: { conservative: 2, moderate: 0, growth: 0, aggressive: 0 } }
      - { id: mid, label: 1–3 years, scores: { conservative: 1, moderate: 2, growth: 1, aggressive: 0 } }
      - { id: long, label: 3–5 years, scores: { conservative: 0, moderate: 1, growth: 2, aggressive: 1 } }
      - { id: vlong, label: 5+ years, scores: { conservative: 0, moderate: 1, growth: 2, aggressive: 2 } }

  - id: goal
    text: What is your primary investment goal?
    options:
      - { id: preserve, label: Preserve capital, scores: { conservative: 3, moderate: 0, growth: 0, aggressive: 0 } }
      - { id: income, label: Income / dividends, scores: { conservative: 2, moderate: 2, growth: 0, aggressive: 0 } }
      - { id: grow, label: Grow wealth, scores: { conservative: 0, moderate: 1, growth: 3, aggressive: 1 } }
      - { id: max, label: Maximize returns, scores: { conservative: 0, moderate: 0, growth: 1, aggressive: 3 } }

  - id: income_need
    text: How important is stable income from holdings?
    options:
      - { id: critical, label: Critical, scores: { conservative: 3, moderate: 1, growth: 0, aggressive: 0 } }
      - { id: nice, label: Nice to have, scores: { conservative: 1, moderate: 2, growth: 1, aggressive: 0 } }
      - { id: none, label: Not needed, scores: { conservative: 0, moderate: 0, growth: 2, aggressive: 2 } }

  - id: experience
    text: How much investing experience do you have?
    options:
      - { id: beginner, label: Beginner (under 2 years), scores: { conservative: 2, moderate: 1, growth: 0, aggressive: 0 } }
      - { id: intermediate, label: 2–5 years, scores: { conservative: 1, moderate: 2, growth: 1, aggressive: 1 } }
      - { id: experienced, label: 5+ years, scores: { conservative: 0, moderate: 1, growth: 2, aggressive: 2 } }

  # Chapter: Risk tolerance
  - id: drawdown
    text: How would you react to a 20% portfolio drop?
    options:
      - { id: sell, label: Sell to limit losses, scores: { conservative: 3, moderate: 0, growth: 0, aggressive: 0 } }
      - { id: hold, label: Hold and wait, scores: { conservative: 1, moderate: 3, growth: 1, aggressive: 0 } }
      - { id: buy, label: Buy more if thesis intact, scores: { conservative: 0, moderate: 1, growth: 2, aggressive: 3 } }

  - id: loss_tolerance
    text: Maximum acceptable loss on a single stock in one year?
    options:
      - { id: low, label: Up to 10%, max_stock_risk: 35 }
      - { id: med, label: Up to 20%, max_stock_risk: 50 }
      - { id: high, label: Up to 30%, max_stock_risk: 65 }
      - { id: very_high, label: 30%+, max_stock_risk: 80 }

  - id: volatility
    text: What volatility are you comfortable with?
    options:
      - { id: low, label: Low, scores: { conservative: 3, moderate: 1, growth: 0, aggressive: 0 }, max_beta: 1.1 }
      - { id: med, label: Medium, scores: { conservative: 0, moderate: 3, growth: 1, aggressive: 0 }, max_beta: 1.35 }
      - { id: high, label: High, scores: { conservative: 0, moderate: 0, growth: 2, aggressive: 3 }, max_beta: 1.8 }

  - id: valuation
    text: How sensitive are you to valuation?
    options:
      - { id: strict, label: Won't buy expensive stocks, scores: { conservative: 3, moderate: 1, growth: 0, aggressive: 0 } }
      - { id: fair, label: Fair valuation is fine, scores: { conservative: 1, moderate: 3, growth: 1, aggressive: 0 } }
      - { id: pay, label: Will pay for quality/growth, scores: { conservative: 0, moderate: 0, growth: 2, aggressive: 3 } }

  - id: leverage
    text: Debt tolerance in portfolio holdings?
    options:
      - { id: low, label: Prefer low leverage only, scores: { conservative: 3, moderate: 1, growth: 0, aggressive: 0 } }
      - { id: mod, label: Moderate leverage OK, scores: { conservative: 0, moderate: 3, growth: 1, aggressive: 0 } }
      - { id: sector, label: Sector norms are fine, scores: { conservative: 0, moderate: 0, growth: 2, aggressive: 3 } }

  - id: liquidity
    text: Might you need to sell within 6 months?
    options:
      - { id: "yes", label: Yes — prefer lower volatility, needs_liquidity: true }
      - { id: "no", label: No — can ride volatility, needs_liquidity: false }

  # Chapter: Portfolio rules
  - id: cyclical_pref
    text: Cyclical vs defensive sector preference?
    options:
      - { id: defensive, label: Prefer defensive (FMCG, Pharma), cyclical_ok: false, sector_filter: defensive }
      - { id: balanced, label: Balanced mix, cyclical_ok: true, sector_filter: all }
      - { id: cyclical, label: OK with cyclical (Auto, Metals, Energy), cyclical_ok: true, sector_filter: cyclical }
      - { id: all, label: All sectors equally, cyclical_ok: true, sector_filter: all }

  - id: concentration
    text: Maximum share of portfolio in one stock?
    options:
      - { id: low, label: Max 10%, max_concentration_pct: 10 }
      - { id: med, label: Max 20%, max_concentration_pct: 20 }
      - { id: high, label: Max 30%+, max_concentration_pct: 30 }

  - id: diversification
    text: Prefer recommendations spread across sectors?
    options:
      - { id: "yes", label: Yes — diversify across sectors, diversify_sectors: true }
      - { id: "no", label: No — best ideas only, diversify_sectors: false }

  - id: sector_exposure
    text: Any sector exposure preference?
    options:
      - { id: all, label: All sectors, sector_filter: all }
      - { id: no_fin, label: Exclude financials/banks, sector_filter: no_financials }
      - { id: deep_only, label: Financials & technology only, sector_filter: both }
