profiles:
  - id: conservative
    label: Capital Preservation
  - id: moderate
    label: Balanced Growth
  - id: growth
    label: Growth Oriented
  - id: aggressive
    label: High Conviction

questions:
  # Chapter A — Investment objective
  - id: horizon
    text: What is your investment horizon?
    options:
      - { id: short, label: Less than 1 year, scores: { conservative: 2, moderate: 0, growth: 0, aggressive: 0 } }
      - { id: mid, label: 1–3 years, scores: { conservative: 1, moderate: 2, growth: 1, aggressive: 0 } }
      - { id: long, label: 3–5 years, scores: { conservative: 0, moderate: 1, growth: 2, aggressive: 1 } }
      - { id: vlong, label: 5+ years, scores: { conservative: 0, moderate: 1, growth: 2, aggressive: 2 } }

  - id: objective
    text: What is your primary investment objective?
    options:
      - { id: preserve, label: Capital preservation, scores: { conservative: 3, moderate: 0, growth: 0, aggressive: 0 } }
      - { id: income, label: Income, scores: { conservative: 2, moderate: 2, growth: 0, aggressive: 0 } }
      - { id: balanced, label: Balanced growth, scores: { conservative: 0, moderate: 3, growth: 1, aggressive: 0 } }
      - { id: max, label: Maximum wealth creation, scores: { conservative: 0, moderate: 0, growth: 2, aggressive: 3 } }

  - id: income_need
    text: How important is regular income from holdings?
    options:
      - { id: high, label: High, scores: { conservative: 3, moderate: 1, growth: 0, aggressive: 0 } }
      - { id: moderate, label: Moderate, scores: { conservative: 1, moderate: 3, growth: 1, aggressive: 0 } }
      - { id: low, label: Low, scores: { conservative: 0, moderate: 1, growth: 2, aggressive: 1 } }
      - { id: none, label: None, scores: { conservative: 0, moderate: 0, growth: 2, aggressive: 2 } }

  # Chapter B — Risk tolerance
  - id: drawdown
    text: How would you react to a 20% portfolio decline?
    options:
      - { id: sell, label: Sell, scores: { conservative: 3, moderate: 0, growth: 0, aggressive: 0 } }
      - { id: wait, label: Wait, scores: { conservative: 2, moderate: 2, growth: 1, aggressive: 0 } }
      - { id: hold, label: Hold, scores: { conservative: 1, moderate: 3, growth: 1, aggressive: 0 } }
      - { id: buy, label: Buy more, scores: { conservative: 0, moderate: 1, growth: 2, aggressive: 3 } }

  - id: loss_tolerance
    text: Maximum acceptable loss on one stock in one year?
    options:
      - { id: low, label: Up to 10%, max_stock_risk: 35 }
      - { id: med, label: Up to 20%, max_stock_risk: 50 }
      - { id: high, label: Up to 30%, max_stock_risk: 65 }
      - { id: very_high, label: 30%+, max_stock_risk: 80 }

  - id: volatility
    text: What is your comfort with short-term volatility?
    options:
      - { id: very_low, label: Very low, scores: { conservative: 3, moderate: 1, growth: 0, aggressive: 0 } }
      - { id: moderate, label: Moderate, scores: { conservative: 0, moderate: 3, growth: 1, aggressive: 0 } }
      - { id: high, label: High, scores: { conservative: 0, moderate: 0, growth: 2, aggressive: 2 } }
      - { id: very_high, label: Very high, scores: { conservative: 0, moderate: 0, growth: 1, aggressive: 3 } }

  - id: liquidity
    text: Might you need to access this money within 6 months?
    options:
      - { id: "yes", label: May need money within 6 months, needs_liquidity: true }
      - { id: "no", label: Don't need it, needs_liquidity: false }

  # Chapter C — Investment preferences
  - id: valuation_pref
    text: What is your valuation preference?
    options:
      - { id: strict, label: Only buy reasonably valued, scores: { conservative: 3, moderate: 1, growth: 0, aggressive: 0 }, valuation_pref: strict }
      - { id: fair, label: Fair price preferred, scores: { conservative: 1, moderate: 3, growth: 1, aggressive: 0 }, valuation_pref: fair }
      - { id: quality, label: Will pay premium for quality, scores: { conservative: 0, moderate: 0, growth: 2, aggressive: 1 }, valuation_pref: quality }
      - { id: growth, label: Will pay premium for high growth, scores: { conservative: 0, moderate: 0, growth: 3, aggressive: 2 }, valuation_pref: growth }

  - id: cyclical_pref
    text: What is your cyclical-sector preference?
    options:
      - { id: avoid, label: Avoid cyclical sectors, cyclical_ok: false, sector_filter: defensive }
      - { id: some, label: Some cyclical exposure OK, cyclical_ok: true, sector_filter: all }
      - { id: comfortable, label: Comfortable with cyclicals, cyclical_ok: true, sector_filter: all, scores: { conservative: 0, moderate: 1, growth: 2, aggressive: 1 } }
      - { id: prefer, label: Prefer cyclical opportunities, cyclical_ok: true, sector_filter: cyclical, scores: { conservative: 0, moderate: 0, growth: 1, aggressive: 3 } }

  # Chapter D — Portfolio construction
  - id: diversification
    text: What is your diversification preference?
    options:
      - { id: high, label: Highly diversified, diversification_level: high }
      - { id: moderate, label: Moderately diversified, diversification_level: moderate }
      - { id: concentrated, label: Concentrated best ideas, diversification_level: concentrated }

  - id: sector_restrictions
    text: Any sector restrictions?
    options:
      - { id: none, label: No restrictions, sector_filter: all }
      - { id: avoid_fin, label: Avoid financials/banks, sector_filter: no_financials }
      - { id: fin_it_only, label: Financials & technology only, sector_filter: both }
